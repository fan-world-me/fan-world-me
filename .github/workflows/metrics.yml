name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Stats card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.stats.svg
          base: header, activity, community, repositories
          plugin_lines: yes
          config_timezone: Europe/Kiev
          config_display: large
          config_animations: yes
          extras_css: |
            .header { background: #0d1117; }

      - name: Languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.langs.svg
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 30
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 10
          plugin_languages_threshold: 0%
          config_timezone: Europe/Kiev

  keep-alive:
    runs-on: ubuntu-latest
    # Only run on schedule, not on every push (would be pointless)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Empty commit if 40+ days since last real commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Find the last commit NOT made by github-actions[bot]
          last_human_commit="$(git log --oneline \
            --author='^(?!github-actions\[bot\])' \
            --perl-regexp \
            --format="%H" \
            -1 2>/dev/null || true)"

          if [ -z "$last_human_commit" ]; then
            last_human_commit="$(git rev-list --max-parents=0 HEAD)"
          fi

          last_date="$(git log -1 --format="%ct" "$last_human_commit")"
          now="$(date +%s)"
          days_since=$(( (now - last_date) / 86400 ))

          echo "Days since last non-bot commit: $days_since"

          if [ "$days_since" -ge 40 ]; then
            echo "40+ days without activity — creating keep-alive empty commit"
            git commit --allow-empty \
              -m "chore: keep workflow alive (${days_since}d since last commit)"
            git push
          else
            echo "Last commit was ${days_since} days ago — no keep-alive needed"
          fi
